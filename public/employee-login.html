<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Employee Login | Talent Forge</title><link rel="stylesheet" href="/css/styles.css"><link rel="stylesheet" href="/css/portal.css"><script src="/js/auth.js" defer></script></head><body class="portal-body" data-role="employee"><main class="login-shell"><a class="brand" href="/"><span class="brand-mark">TF</span><span><b>TALENT FORGE</b><small>EMPLOYEE PORTAL</small></span></a><section class="login-card"><div class="login-icon">♙</div><div class="eyebrow">EMPLOYEE ACCESS</div><h1>Employee sign in</h1><p>Sign in using your verified Talent Forge employee account.</p><form id="loginForm"><label class="portal-field">Company email<input type="email" name="email" autocomplete="username" required placeholder="you@company.com"></label><label class="portal-field">Password<input type="password" name="password" autocomplete="current-password" required placeholder="Enter your password"></label><div id="loginMessage" class="portal-message" role="alert"></div><button class="button button-primary button-full" type="submit" id="loginButton">Sign in to Employee Dashboard →</button></form><a href="/" class="back-link">← Back to public website</a></section><p class="login-foot">Your account can only access leads assigned to you.</p></main></body></html>
